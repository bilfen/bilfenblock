<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>BilfenBlock</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout: turuncu çerçeve; solda sekmeli düzenleyici (Kod / Kostümler / Sesler), sağda sahne ve karakter paneli; telefonda sahne üstte. */
:root {
  --orange: #F28A1E;
  --orange-d: #D46F08;
  --orange-bg: #FBE0C3;
  --navy: #0B4A80;
  --navy-l: #E6EFF8;
  --panel: #FFFFFF;
  --soft: #FFF5EA;
  --ink: #1F2733;
  --muted: #6B6155;
  --line: #EBD3B8;
  --go: #2DB36A;
  --stop: #E5484D;
  --var: #FF8C1A;
  --display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --body: "Nunito", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--orange-bg); color: var(--ink); font-family: var(--body); font-weight: 600; overflow: hidden; }
* { box-sizing: border-box; }
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--navy); outline-offset: 2px; }
.app { display: grid; grid-template-rows: auto minmax(0, 1fr); height: 100%; }

/* Üst çubuk */
.topbar {
  background: var(--orange); color: #fff;
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding-block: 7px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-shadow: 0 2px 0 var(--orange-d);
  position: relative; z-index: 20;
}
.logo { height: 42px; width: auto; display: block; filter: drop-shadow(0 1px 1px rgba(80,30,0,.25)); }
.brand { font-family: var(--display); font-weight: 800; font-size: 25px; line-height: 1; letter-spacing: .2px; margin-right: 6px; color: #fff; }
.brand span { color: var(--navy); }
.tbtn { display: inline-flex; align-items: center; gap: 6px; background: transparent; color: #fff; border: 0; border-radius: 8px; padding: 7px 11px; font-weight: 800; font-size: 14px; }
.tbtn:hover, .tbtn[aria-expanded="true"] { background: var(--orange-d); }
.pname { background: rgba(255,255,255,.18); border: 1px solid rgba(255,255,255,.35); border-radius: 8px; padding: 6px 10px; width: 170px; color: #fff; font-weight: 800; }
.pname::placeholder { color: rgba(255,255,255,.7); }
.pname:focus { background: #fff; color: var(--ink); }
.spacer { flex: 1; }
.savestate { font-size: 12px; opacity: .9; }
.menuwrap { position: relative; }
.menu { position: absolute; top: calc(100% + 6px); left: 0; background: var(--panel); color: var(--ink); border-radius: 10px; box-shadow: 0 12px 30px rgba(60,30,0,.25); padding: 6px; min-width: 250px; display: grid; gap: 2px; z-index: 30; }
.menu button { text-align: left; border: 0; background: transparent; padding: 9px 11px; border-radius: 7px; font-weight: 700; }
.menu button:hover { background: var(--soft); }
.menu small { display: block; color: var(--muted); font-weight: 600; font-size: 12px; }

main {
  display: grid; grid-template-columns: minmax(0, 1fr) clamp(340px, 37vw, 520px);
  gap: 12px; min-height: 0;
  padding-block: 10px 12px;
  padding-left: max(12px, env(safe-area-inset-left, 0px));
  padding-right: max(12px, env(safe-area-inset-right, 0px));
}
.big main { grid-template-columns: minmax(0, 1fr) clamp(340px, 55vw, 860px); }
.editor { display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: 0; min-width: 0; }
.tabs { display: flex; gap: 4px; padding-left: 6px; }
.tab { border: 1px solid var(--line); border-bottom: 0; background: #F9D7B2; border-radius: 10px 10px 0 0; padding: 7px 16px; font-weight: 800; color: var(--muted); display: inline-flex; gap: 7px; align-items: center; }
.tab svg { width: 16px; height: 16px; }
.tab[aria-selected="true"] { background: var(--panel); color: var(--orange-d); position: relative; top: 1px; }
.pane { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; position: relative; overflow: hidden; min-height: 0; min-width: 0; }
#blocklyDiv { position: absolute; inset: 0; }
.wsctl { position: absolute; right: 14px; bottom: 14px; display: flex; flex-direction: column; gap: 6px; z-index: 5; }
.wsctl button { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel); font-size: 20px; font-weight: 800; color: var(--muted); display: grid; place-items: center; box-shadow: 0 1px 3px rgba(60,30,0,.15); }
.wsctl button:hover { color: var(--ink); }
.toast { position: fixed; left: 50%; top: 70px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 8px 16px; border-radius: 999px; font-size: 14px; z-index: 200; pointer-events: none; max-width: min(90%, 560px); text-align: center; }
.err { padding: 24px; line-height: 1.5; }

/* Kostüm ve ses sekmeleri */
.assets { display: grid; grid-template-columns: 150px minmax(0, 1fr); height: 100%; }
.alist { border-right: 1px solid var(--line); background: var(--soft); overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.aitem { position: relative; border: 2px solid transparent; background: var(--panel); border-radius: 10px; padding: 6px; display: grid; gap: 4px; justify-items: center; text-align: center; font-size: 12px; box-shadow: 0 1px 2px rgba(60,30,0,.12); cursor: pointer; }
.aitem[aria-current="true"] { border-color: var(--orange); }
.aitem .num { position: absolute; left: 6px; top: 4px; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.aitem img { width: 90px; height: 70px; object-fit: contain; display: block; }
.aitem .nm { width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.aitem .del { position: absolute; right: -6px; top: -6px; width: 22px; height: 22px; border-radius: 50%; border: 0; background: var(--stop); color: #fff; font-size: 13px; line-height: 1; display: grid; place-items: center; }
.adetail { padding: 16px; display: grid; gap: 14px; align-content: start; overflow-y: auto; }
.adetail .preview { border: 1px dashed var(--line); border-radius: 12px; height: 260px; display: grid; place-items: center; overflow: hidden; background-color: var(--soft); background-image: linear-gradient(45deg, #FBEBDB 25%, transparent 25%), linear-gradient(-45deg, #FBEBDB 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #FBEBDB 75%), linear-gradient(-45deg, transparent 75%, #FBEBDB 75%); background-size: 20px 20px; background-position: 0 0, 0 10px, 10px -10px, -10px 0; }
.adetail .preview img { max-width: 92%; max-height: 230px; width: auto; height: auto; object-fit: contain; }
.field { display: grid; gap: 4px; font-size: 13px; color: var(--muted); min-width: 0; }
.field input { border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; background: var(--panel); color: var(--ink); min-width: 0; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 7px 12px; font-weight: 800; font-size: 13px; display: inline-flex; gap: 6px; align-items: center; }
.btn:hover { border-color: #D9B48C; }
.btn.primary { background: var(--orange); border-color: var(--orange); color: #fff; }
.btn.primary:hover { background: var(--orange-d); }
.hint { font-size: 13px; color: var(--muted); line-height: 1.45; margin: 0; }
.play { width: 34px; height: 34px; border-radius: 50%; border: 0; background: #CF63CF; color: #fff; display: grid; place-items: center; flex: none; }
.wave { width: 100%; height: 90px; background: var(--soft); border-radius: 10px; display: block; }

/* Sağ taraf */
.side { display: flex; flex-direction: column; gap: 10px; min-height: 0; overflow-y: auto; min-width: 0; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
.stagecard { padding: 8px; }
.stagehead { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
.flag, .stopb { width: 42px; height: 36px; border-radius: 9px; border: 1px solid var(--line); background: var(--panel); display: grid; place-items: center; }
.flag:hover, .stopb:hover { background: var(--soft); }
.flag svg, .stopb svg { width: 24px; height: 24px; }
.flag.on { background: #DDF5E7; border-color: var(--go); }
.coords { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; margin-left: auto; }
.ibtn { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); display: grid; place-items: center; color: var(--muted); }
.ibtn:hover { color: var(--ink); }
.stagewrap { position: relative; width: 100%; aspect-ratio: 4 / 3; max-width: 100%; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); background: #fff; touch-action: none; }
.stagewrap:fullscreen { border-radius: 0; border: 0; background: #000; display: grid; place-items: center; }
.stagewrap:fullscreen #stage { width: auto; height: 100%; max-width: 100%; aspect-ratio: 4 / 3; }
#stage { width: 100%; height: 100%; display: block; }
#monitors { position: absolute; left: 6px; top: 6px; display: flex; flex-direction: column; gap: 4px; pointer-events: none; align-items: flex-start; }
.mon { display: inline-flex; align-items: center; gap: 6px; background: #F2F5F9; border: 1px solid #C9D3DF; border-radius: 6px; padding: 2px 3px 2px 7px; font-size: 12px; color: #1F2733; }
.mon b { background: var(--var); color: #fff; border-radius: 5px; padding: 0 7px; min-width: 26px; text-align: center; font-variant-numeric: tabular-nums; }
.mon.list { flex-direction: column; align-items: stretch; padding: 3px; gap: 2px; min-width: 90px; }
.mon.list .it { background: #FC662C; color: #fff; border-radius: 4px; padding: 0 6px; font-size: 11px; max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.askbox { position: absolute; left: 8px; right: 8px; bottom: 8px; display: grid; gap: 5px; background: #fff; border: 2px solid #5CB1D6; border-radius: 10px; padding: 6px; }
.askbox label { font-size: 13px; }
.askbox .r { display: flex; gap: 6px; }
.askbox input { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 7px; padding: 6px 9px; }
.askbox button { border: 0; background: #5CB1D6; color: #fff; border-radius: 7px; padding: 0 12px; font-weight: 800; }

.spritepane { padding: 10px; display: grid; gap: 10px; }
.info { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; align-items: end; }
.info .field input { padding: 5px 7px; font-variant-numeric: tabular-nums; width: 100%; }
.info .wide { grid-column: span 3; }
.info .vis { display: flex; gap: 4px; grid-column: span 3; }
.info .vis button { flex: 1; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 5px 0; font-size: 12px; font-weight: 800; color: var(--muted); }
.info .vis button[aria-pressed="true"] { background: var(--navy-l); border-color: var(--navy); color: var(--navy); }
.lower { display: grid; grid-template-columns: minmax(0, 1fr) 96px; gap: 10px; }
.sprites { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 8px; align-content: start; background: var(--soft); border-radius: 10px; padding: 8px; min-height: 120px; min-width: 0; }
.tile { position: relative; border: 2px solid transparent; border-radius: 10px; background: var(--panel); padding: 5px 4px 4px; display: grid; justify-items: center; gap: 2px; font-size: 12px; box-shadow: 0 1px 2px rgba(60,30,0,.12); min-width: 0; }
.tile img { width: 56px; height: 46px; object-fit: contain; }
.tile .nm { width: 100%; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tile[aria-current="true"] { border-color: var(--orange); background: #FFF0E0; }
.addbtn { border: 2px dashed #E7B783; background: transparent; border-radius: 10px; display: grid; place-items: center; gap: 2px; color: var(--orange-d); font-weight: 800; font-size: 12px; padding: 6px; }
.addbtn:hover { background: #FFE9D2; }
.addbtn b { font-size: 22px; line-height: 1; }
.stagecol { display: grid; gap: 6px; align-content: start; }
.stagecol .tile img { width: 80px; height: 60px; object-fit: cover; border-radius: 4px; }

/* Pencere */
.modal { position: fixed; inset: 0; background: rgba(60, 30, 0, .45); display: grid; place-items: center; z-index: 100; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px; }
.sheet { background: var(--panel); border-radius: 14px; padding: 18px; width: min(470px, 100%); max-height: 100%; overflow-y: auto; display: grid; gap: 12px; box-shadow: 0 20px 50px rgba(60,30,0,.35); }
.sheet.wide { width: min(780px, 100%); }
.sheet h2 { margin: 0; font-family: var(--display); font-size: 21px; font-weight: 700; text-wrap: balance; }
.sheet p { margin: 0; color: var(--muted); line-height: 1.45; }
.sheet > input { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--soft); }
.actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.lib { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 10px; }
.lib button { border: 2px solid var(--line); background: var(--soft); border-radius: 12px; padding: 8px; display: grid; gap: 6px; justify-items: center; font-weight: 800; font-size: 13px; }
.lib button:hover { border-color: var(--orange); background: #FFF0E0; }
.lib img { width: 92px; height: 80px; object-fit: contain; }
.lib.bg img { object-fit: cover; border-radius: 6px; }
.params { display: grid; gap: 6px; }
.param { display: flex; gap: 6px; align-items: center; }
.param input { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; }
.param span { font-size: 12px; color: var(--muted); width: 82px; }
.check { display: flex; gap: 8px; align-items: center; font-size: 14px; }

.sheet.xwide { width: min(1000px, 100%); }
.libwrap { display: grid; gap: 12px; min-width: 0; }
.libhead { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; background: #EFE7FF; border-radius: 12px; padding: 10px; }
.libsearch { display: flex; align-items: center; gap: 6px; background: #fff; border-radius: 999px; padding: 6px 12px; color: #7C5CC4; flex: 0 1 200px; min-width: 140px; }
.libsearch input { border: 0; outline: 0; min-width: 0; width: 100%; background: transparent; }
.libcats { display: flex; flex-wrap: wrap; gap: 6px; }
.libcats button { border: 0; border-radius: 999px; padding: 6px 13px; background: #8E63D9; color: #fff; font-weight: 800; font-size: 13px; }
.libcats button:hover { background: #7A4FC9; }
.libcats button[aria-pressed="true"] { background: var(--orange); }
.libscroll { max-height: min(58vh, 560px); overflow-y: auto; padding: 2px; }
.lib button span { overflow: hidden; text-overflow: ellipsis; max-width: 100%; white-space: nowrap; }
.paint { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; }
.ptools { display: flex; flex-direction: column; gap: 6px; }
.ptools button { display: grid; justify-items: center; gap: 2px; width: 66px; padding: 7px 4px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); font-size: 11px; font-weight: 800; color: var(--muted); }
.ptools button[aria-pressed="true"] { background: #FFF0E0; border-color: var(--orange); color: var(--orange-d); }
.pmain { display: grid; gap: 10px; min-width: 0; }
.pcolors { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.pcolors .sw { width: 26px; height: 26px; border-radius: 50%; border: 2px solid rgba(0,0,0,.15); padding: 0; }
.pcolors .sw[aria-pressed="true"] { outline: 3px solid var(--orange); outline-offset: 1px; }
.pcustom input { width: 34px; height: 30px; border: 0; padding: 0; background: none; }
.prow { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.pfield { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); }
.pfield input[type="range"] { width: 120px; }
.pfield input:not([type]) , .pfield #pText, .pfield #pName { border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; }
.pfield.grow { flex: 1; min-width: 160px; }
.pfield.grow input { flex: 1; min-width: 0; }
.pfield b { min-width: 22px; font-variant-numeric: tabular-nums; color: var(--ink); }
.pcanvas { position: relative; width: 100%; aspect-ratio: 4 / 3; max-width: 100%; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background-color: #fff; background-image: linear-gradient(45deg, #F1EBE4 25%, transparent 25%), linear-gradient(-45deg, #F1EBE4 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #F1EBE4 75%), linear-gradient(-45deg, transparent 75%, #F1EBE4 75%); background-size: 20px 20px; background-position: 0 0, 0 10px, 10px -10px, -10px 0; touch-action: none; }
.pcanvas.bd { background-image: none; }
.pcanvas { max-width: min(100%, calc((100vh - 280px) * 4 / 3)); justify-self: center; }
.pcanvas canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.pcenter { position: absolute; left: 50%; top: 50%; width: 18px; height: 18px; transform: translate(-50%, -50%); pointer-events: none; background: linear-gradient(var(--navy), var(--navy)) center / 2px 100% no-repeat, linear-gradient(var(--navy), var(--navy)) center / 100% 2px no-repeat; opacity: .5; }
@media (max-width: 640px) { .paint { grid-template-columns: minmax(0, 1fr); } .ptools { flex-direction: row; flex-wrap: wrap; } .ptools button { width: 58px; } }

/* Blockly kategori listesi */
.blocklyToolboxDiv { background: var(--panel) !important; border-right: 1px solid var(--line); padding-top: 6px !important; }
.blocklyTreeRow { height: auto !important; line-height: 1.2 !important; padding: 8px 12px 8px 8px !important; margin: 2px 6px 2px 0 !important; border-radius: 0 8px 8px 0; border-left-width: 7px !important; }
.blocklyTreeLabel { font-family: var(--body) !important; font-weight: 800 !important; font-size: 13.5px !important; color: var(--ink); }
.blocklyTreeSelected .blocklyTreeLabel { color: #fff; }
.blocklyFlyoutButton { fill: var(--panel); stroke: #C9D3DF; }
.blocklyFlyoutButton .blocklyText { fill: var(--ink) !important; font-weight: 800; }
.blocklyFlyoutButtonShadow { fill: transparent; }
.blocklyFlyoutButton:hover { fill: var(--soft); }

@media (max-width: 900px) {
  html, body { height: auto; overflow: auto; }
  .app { height: auto; }
  main, .big main { grid-template-columns: minmax(0, 1fr); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .side { order: -1; overflow: visible; }
  .editor { height: 76vh; min-height: 440px; }
  .bigbtn { display: none; }
}
@media (max-width: 520px) {
  .logo { height: 34px; }
  .brand { font-size: 21px; }
  .pname { width: 130px; }
  .assets { grid-template-columns: 112px minmax(0, 1fr); }
  .aitem img { width: 70px; height: 56px; }
  .info { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .info .wide, .info .vis { grid-column: span 4; }
  .lower { grid-template-columns: minmax(0, 1fr) 84px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

/* =========================================================

const now = () => performance.now();

const isWhite = s => typeof s === 'string' && s.trim() === '';
function toNum(v) {
  if (typeof v === 'number') return isNaN(v) ? 0 : v;

/* ---------- Pencere ---------- */
function showModal(o) {
  return new Promise(resolve => {
    const m = $('modal'), inp = $('mInput'), body = $('mBody');
    $('sheet').className = 'sheet' + (o.wide ? ' wide' : '') + (o.wide === 'paint' ? ' xwide' : '');
    $('mTitle').textContent = o.title || '';
    $('mText').hidden = !o.text; $('mText').textContent = o.text || '';
    inp.hidden = o.input === undefined; inp.value = o.input ?? '';
    body.hidden = !o.body; body.innerHTML = ''; if (o.body) body.appendChild(o.body);
    const acts = $('mActions'); acts.innerHTML = '';
    let done = false;
    const onKey = e => {
      if (e.key === 'Escape') { e.preventDefault(); close(null); }
      else if (e.key === 'Enter' && o.input !== undefined && document.activeElement === inp) { e.preventDefault(); close(inp.value); }
    };
    const close = v => { if (done) return; done = true; m.hidden = true; body.innerHTML = ''; document.removeEventListener('keydown', onKey, true); resolve(v); };
    const buttons = o.buttons || [{ label: 'Vazgeç', value: null }, { label: o.ok || 'Tamam', primary: true, value: () => (o.input !== undefined ? inp.value : (o.collect ? o.collect() : true)) }];

    document.addEventListener('keydown', onKey, true);

  });
}

/* Bloklarım (Scratch "My Blocks") */
function parseProc(code) { return String(code || '').split(/(%[snb])/).filter(s => s !== ''); }
function clearInputs(b) { while (b.inputList.length) b.removeInput(b.inputList[0].name); }
Blockly.Blocks.procedures_definition = {
  init() {
    this.setStyle('myblocks_hat'); this.setNextStatement(true); this.setInputsInline(true);
    this.es = { proccode: 'blok', argumentnames: [], argumentids: [], argumentdefaults: [], warp: false };
    this.build_();
  },
  saveExtraState() { return Object.assign({}, this.es); },
  loadExtraState(s) { this.es = Object.assign({ argumentnames: [], argumentids: [], argumentdefaults: [], warp: false }, s || {}); this.build_(); },
  build_() {
    clearInputs(this);
    const inp = this.appendDummyInput('L0'); inp.appendField('tanımla');
    let ai = 0;
    for (const p of parseProc(this.es.proccode)) {
      if (/^%[snb]$/.test(p)) { const nm = this.es.argumentnames[ai++] ?? ''; inp.appendField(new Blockly.FieldLabel(p === '%b' ? `‹${nm}›` : `(${nm})`)); }
      else if (p.trim()) inp.appendField(new Blockly.FieldLabel(p.trim()));
    }
  }
};
Blockly.Blocks.procedures_call = {
  init() {
    this.setStyle('myblocks'); this.setPreviousStatement(true); this.setNextStatement(true); this.setInputsInline(true);
    this.es = { proccode: 'blok', argumentids: [], warp: false };
    this.build_();
  },
  saveExtraState() { return Object.assign({}, this.es); },
  loadExtraState(s) { this.es = Object.assign({ argumentids: [], warp: false }, s || {}); this.build_(); },
  build_() {
    clearInputs(this);
    let label = '', ai = 0;
    for (const p of parseProc(this.es.proccode)) {
      if (/^%[snb]$/.test(p)) {
        const id = this.es.argumentids[ai] || ('ARG' + ai); ai++;
        const inp = this.appendValueInput(id);
        if (p === '%b') inp.setCheck('Boolean');
        if (label.trim()) inp.appendField(label.trim());
        label = '';
      } else label += p;
    }
    if (label.trim() || !this.inputList.length) this.appendDummyInput('LEND').appendField(label.trim() || this.es.proccode || 'blok');
  }
};
function unknownBlock(isReporter) {
  return {
    init() {
      this.setStyle('unknown');
      if (isReporter) this.setOutput(true); else { this.setPreviousStatement(true); this.setNextStatement(true); }
      this.appendDummyInput('L').appendField(new Blockly.FieldLabel('?'), 'LBL');
      this.es = { opcode: '?' };
      this.setTooltip('Bu blok BilfenBlock\'ta henüz çalışmıyor; kaydedince korunur.');
    },
    saveExtraState() { return this.es; },
    loadExtraState(s) { this.es = s || {}; this.getField('LBL').setValue('⚠ ' + (this.es.opcode || '?')); }
  };
}
Blockly.Blocks.bilfen_unknown = unknownBlock(false);

    let lim = 0; try { lim = toNum(V({ inst, frames: [] }, top, 'VALUE')); } catch (e) { /* yok say */ }
    const on = val > lim;
    if (on && !gtState[key] && !threads.some(t => t.key === key && !t.done)) startThread(inst, top.id, top.next && top.next.block);

}

/* ---------- Scratch 3 / mBlock içe aktarma ---------- */
const KNOWN = new Set(BLOCKS.map(b => b.type).concat(['procedures_definition', 'procedures_call']));
const PRIM_TYPES = { 4: 'math_number', 5: 'math_positive_number', 6: 'math_whole_number', 7: 'math_integer', 8: 'math_angle' };
const numLike = v => /^\s*[-+]?(\d*\.?\d*)([eE][-+]?\d+)?\s*$/.test(String(v ?? ''));
const parseJ = s => { try { return Array.isArray(s) ? s : JSON.parse(s || '[]'); } catch (e) { return []; } };
async function importScratch(file) {
  if (typeof JSZip === 'undefined') throw new Error('zip');

  const names = Object.keys(zip.files);
  const pjName = names.find(n => /(^|\/)project\.json$/i.test(n)) || names.find(n => /\.json$/i.test(n) && !zip.files[n].dir);
  if (!pjName) throw new Error('project.json yok');
  const json = JSON.parse(await zip.file(pjName).async('string'));
  if (!json.targets) throw new Error(json.objName ? 'sb2' : 'biçim');
  const getAsset = async fname => {
    const hit = names.find(n => n === fname || n.endsWith('/' + fname));
    return hit ? zip.file(hit).async('uint8array') : null;
  };
  return convertSb3(json, getAsset, file.name.replace(/\.[^.]+$/, ''));
}
async function convertSb3(json, getAsset, name) {
  const variables = [], taken = { '': new Set(), list: new Set() };
  const known = new Set();
  const addVar = (id, nm, value, type, owner) => {
    let shown = String(nm); if (taken[type].has(shown)) shown = uniqName(`${nm} (${owner ? owner.name : 'Sahne'})`, taken[type]);
    taken[type].add(shown); known.add(id);
    variables.push({ id, name: shown, orig: String(nm), type, owner: owner ? owner.id : null, value, monitor: false });
  };
  const tgs = json.targets.map(t => ({ src: t, id: uid(), name: t.isStage ? 'Sahne' : String(t.name) }));
  tgs.forEach(T => {
    const t = T.src, owner = t.isStage ? null : T;
    for (const [vid, v] of Object.entries(t.variables || {})) if (!known.has(vid)) addVar(vid, v[0], v[1], '', owner);
    for (const [lid, l] of Object.entries(t.lists || {})) if (!known.has(lid)) addVar(lid, l[0], Array.isArray(l[1]) ? l[1] : [], 'list', owner);
  });
  (json.monitors || []).forEach(m => {
    if (!m.visible) return;
    const v = variables.find(x => x.id === m.id) || variables.find(x => m.params && (m.params.VARIABLE === x.orig || m.params.LIST === x.orig) && ((!m.spriteName && !x.owner) || (tgs.find(T => T.id === x.owner) || {}).name === m.spriteName));
    if (v) v.monitor = true;
  });
  const varIdByName = (nm, type) => { const v = variables.find(x => x.type === type && (x.orig === nm || x.name === nm)); if (v) return v.id; const id = uid(); addVar(id, nm ?? type, type === 'list' ? [] : 0, type, null); return id; };

  const targets = [];
  for (const T of tgs) {
    const t = T.src, blocks = t.blocks || {};
    const inputChildren = new Set();
    for (const b of Object.values(blocks)) if (b && !Array.isArray(b) && b.inputs) for (const [nm, arr] of Object.entries(b.inputs)) if (!/^SUBSTACK/.test(nm) && Array.isArray(arr)) for (const r of arr.slice(1)) if (typeof r === 'string') inputChildren.add(r);
    const prim = a => {
      switch (a[0]) {
        case 4: case 5: case 6: case 7: case 8: return numLike(a[1]) ? { type: PRIM_TYPES[a[0]], fields: { NUM: String(a[1] ?? '') } } : { type: 'text', fields: { TEXT: String(a[1] ?? '') } };
        case 9: { let c = String(a[1] || '#000000'); if (!/^#[0-9a-f]{6}$/i.test(c)) c = '#000000'; return { type: 'colour_picker', fields: { COLOUR: c.toLowerCase() } }; }
        case 10: return { type: 'text', fields: { TEXT: String(a[1] ?? '') } };
        case 11: return { type: 'event_broadcast_menu', fields: { BROADCAST_OPTION: String(a[1] ?? '') } };
        case 12: return { type: 'data_variable', id: uid(), fields: { VARIABLE: { id: known.has(a[2]) ? a[2] : varIdByName(a[1], '') } } };
        case 13: return { type: 'data_listcontents', id: uid(), fields: { LIST: { id: known.has(a[2]) ? a[2] : varIdByName(a[1], 'list') } } };
      }
      return { type: 'text', fields: { TEXT: '' } };
    };
    let count = 0;
    const node = (id, asShadow) => {
      const b = blocks[id]; if (!b) return null;
      if (Array.isArray(b)) return prim(b);
      if (++count > 100000) return null;
      const op = b.opcode;
      if (op === 'procedures_definition') {
        const protoId = b.inputs && b.inputs.custom_block && b.inputs.custom_block[1];
        const m = (blocks[protoId] && blocks[protoId].mutation) || {};
        const n = { type: op, id, extraState: { proccode: m.proccode || 'blok', argumentids: parseJ(m.argumentids), argumentnames: parseJ(m.argumentnames), argumentdefaults: parseJ(m.argumentdefaults), warp: m.warp === 'true' || m.warp === true } };
        if (b.next) { const nx = node(b.next); if (nx) n.next = { block: nx }; }
        return n;
      }
      if (!KNOWN.has(op)) {
        if (asShadow) { const f = b.fields ? Object.values(b.fields)[0] : null; return { type: 'text', fields: { TEXT: f ? String(f[0] ?? '') : '' } }; }
        const n = { type: inputChildren.has(id) ? 'bilfen_unknown_reporter' : 'bilfen_unknown', id, extraState: { opcode: op, fields: b.fields || {} } };

      }
      const n = { type: op, id };
      if (b.fields && Object.keys(b.fields).length) {

          if (fn === 'VARIABLE') n.fields[fn] = { id: fid && known.has(fid) ? fid : varIdByName(val, '') };
          else if (fn === 'LIST') n.fields[fn] = { id: fid && known.has(fid) ? fid : varIdByName(val, 'list') };
          else n.fields[fn] = val === null || val === undefined ? '' : String(val);
        }
        if (/^math_/.test(op) && n.fields.NUM !== undefined && !numLike(n.fields.NUM)) return { type: 'text', fields: { TEXT: n.fields.NUM } };
      }
      if (op === 'procedures_call' && b.mutation) n.extraState = { proccode: b.mutation.proccode || '', argumentids: parseJ(b.mutation.argumentids), warp: b.mutation.warp === 'true' || b.mutation.warp === true };
      if (b.inputs && Object.keys(b.inputs).length) {
        n.inputs = {};
        for (const [iname, arr] of Object.entries(b.inputs)) {
          if (!Array.isArray(arr)) continue;
          const kind = arr[0];
          const isReal = r => typeof r === 'string' && blocks[r] && !Array.isArray(blocks[r]) && !blocks[r].shadow;
          if (/^SUBSTACK/.test(iname)) { const s = typeof arr[1] === 'string' ? node(arr[1], false) : null; if (s) n.inputs[iname] = { block: s }; continue; }
          let blk = null, sh = null;
          const r1 = arr[1], r2 = arr[2];
          if (kind === 1) { if (isReal(r1)) blk = node(r1, false); else if (r1 != null) sh = Array.isArray(r1) ? prim(r1) : node(r1, true); }
          else if (kind === 2) { if (r1 != null) blk = Array.isArray(r1) ? prim(r1) : node(r1, false); }
          else { if (r1 != null) blk = Array.isArray(r1) ? prim(r1) : node(r1, false); if (r2 != null && !isReal(r2)) sh = Array.isArray(r2) ? prim(r2) : node(r2, true); }
          if (blk && /^(math_|text$|colour_picker$|event_broadcast_menu$)/.test(blk.type) && !sh) { sh = blk; blk = null; }
          const o = {}; if (sh) o.shadow = sh; if (blk) o.block = blk;
          if (o.shadow || o.block) n.inputs[iname] = o;
        }

      if (b.next) { const nx = node(b.next); if (nx) n.next = { block: nx }; }
      return n;
    };
    const tops = [];
    for (const [id, b] of Object.entries(blocks)) {
      if (Array.isArray(b)) { if ((b[0] === 12 || b[0] === 13) && b.length >= 5) { const p = prim(b); p.x = b[3]; p.y = b[4]; tops.push(p); } continue; }
      if (b && b.topLevel && !b.shadow) { const n = node(id); if (n) { n.x = Math.round(b.x || 0); n.y = Math.round(b.y || 0); tops.push(n); } }
    }
    const costumes = [];
    for (const c of t.costumes || []) {
      const fname = c.md5ext || (c.assetId + '.' + c.dataFormat);
      const bytes = await getAsset(fname); if (!bytes) continue;
      const fmt = (c.dataFormat || fname.split('.').pop() || 'png').toLowerCase();
      costumes.push({ name: String(c.name), dataURL: `data:${mimeOf(fmt)};base64,${bytesToB64(bytes)}`, rcx: c.rotationCenterX || 0, rcy: c.rotationCenterY || 0, res: c.bitmapResolution || (fmt === 'svg' ? 1 : 2) });
    }
    const sounds = [];
    for (const s of t.sounds || []) {
      const fname = s.md5ext || (s.assetId + '.' + s.dataFormat);
      const bytes = await getAsset(fname); if (!bytes) continue;
      sounds.push({ name: String(s.name), dataURL: `data:${mimeOf((s.dataFormat || 'wav').toLowerCase())};base64,${bytesToB64(bytes)}` });
    }
    targets.push({
      id: T.id, name: T.name, isStage: !!t.isStage, blocks: tops, costumes, sounds,
      currentCostume: t.currentCostume || 0, x: t.x || 0, y: t.y || 0, direction: t.direction ?? 90, size: t.size ?? 100, visible: t.visible !== false,
      rotationStyle: t.rotationStyle || 'all around', draggable: !!t.draggable, volume: t.volume ?? 100, layer: t.layerOrder ?? 0

  }
  const st = json.targets.find(t => t.isStage);

}

/* ---------- Scratch 3 biçiminde dışa aktarma ---------- */
const PRIM_CODE = { math_number: 4, math_positive_number: 5, math_whole_number: 6, math_integer: 7, math_angle: 8 };

  const bcast = new Map();

  };

    if (PRIM_CODE[n.type]) return [PRIM_CODE[n.type], String(n.fields?.NUM ?? '')];
    if (n.type === 'text') return [10, String(n.fields?.TEXT ?? '')];
    if (n.type === 'colour_picker') return [9, String(n.fields?.COLOUR ?? '#000000')];
    const nm = String(n.fields?.BROADCAST_OPTION ?? ''); return [11, nm, bid(nm)];
  };
  const vname = id => { const m = vmeta.get(id); return m ? (m.orig || m.name) : ''; };
  const targetJson = t => {
    const out = {};
    const flat = (n, parent, top, asShadow) => {
      const id = (n.id && !out[n.id]) ? n.id : uid();
      if (top && (n.type === 'data_variable' || n.type === 'data_listcontents')) {
        const isL = n.type === 'data_listcontents', vid = n.fields?.[isL ? 'LIST' : 'VARIABLE']?.id;
        out[id] = [isL ? 13 : 12, vname(vid), vid, n.x || 0, n.y || 0]; return id;
      }
      const e = { opcode: n.type, next: null, parent: parent || null, inputs: {}, fields: {}, shadow: !!asShadow, topLevel: !!top };
      if (top) { e.x = n.x || 0; e.y = n.y || 0; }
      out[id] = e;
      if (n.type === 'bilfen_unknown' || n.type === 'bilfen_unknown_reporter') { e.opcode = n.extraState?.opcode || 'unknown'; e.fields = n.extraState?.fields || {}; }
      if (n.type === 'note') e.fields.NOTE = [String(n.fields?.NOTE ?? '60'), null];
      for (const [k, v] of Object.entries(n.fields || {})) {
        if (n.type === 'note') continue;
        if (k === 'VARIABLE' || k === 'LIST') e.fields[k] = [vname(v.id), v.id];
        else if (k === 'BROADCAST_OPTION') e.fields[k] = [v, bid(v)];
        else e.fields[k] = [v, null];

      if (n.type === 'procedures_definition') {
        const es = n.extraState || {}, pid = uid();
        const proto = { opcode: 'procedures_prototype', next: null, parent: id, inputs: {}, fields: {}, shadow: true, topLevel: false,
          mutation: { tagName: 'mutation', children: [], proccode: es.proccode, argumentids: JSON.stringify(es.argumentids || []), argumentnames: JSON.stringify(es.argumentnames || []), argumentdefaults: JSON.stringify(es.argumentdefaults || []), warp: String(!!es.warp) } };
        out[pid] = proto; e.inputs.custom_block = [1, pid];
        const kinds = parseProc(es.proccode).filter(p => /^%[snb]$/.test(p));
        (es.argumentids || []).forEach((aid, i) => {
          const rid = uid(); out[rid] = { opcode: kinds[i] === '%b' ? 'argument_reporter_boolean' : 'argument_reporter_string_number', next: null, parent: pid, inputs: {}, fields: { VALUE: [(es.argumentnames || [])[i] || '', null] }, shadow: true, topLevel: false };
          proto.inputs[aid] = [1, rid];

      }
      if (n.type === 'procedures_call') { const es = n.extraState || {}; e.mutation = { tagName: 'mutation', children: [], proccode: es.proccode || '', argumentids: JSON.stringify(es.argumentids || []), warp: String(!!es.warp) }; }

  const order = d.targets.filter(t => !t.isStage).sort((a, b) => (a.layer ?? 0) - (b.layer ?? 0));
  const targets = d.targets.map(t => {
    const variables = {}, lists = {};
    d.variables.forEach(v => {
      const mine = t.isStage ? (!v.owner || v.owner === stageT.id) : v.owner === t.id;
      if (!mine) return;
      if (v.type === 'list') lists[v.id] = [v.orig || v.name, (Array.isArray(v.value) ? v.value : []).map(x => typeof x === 'number' ? x : str(x))];
      else variables[v.id] = [v.orig || v.name, v.value ?? 0];

    const o = {
      isStage: t.isStage, name: t.isStage ? 'Stage' : t.name, variables, lists, broadcasts: {}, blocks: targetJson(t), comments: {},
      currentCostume: clamp(t.currentCostume || 0, 0, Math.max(0, t.costumes.length - 1)),
      costumes: t.costumes.map(c => { const a = putAsset(c.dataURL, 'png'); return { name: c.name, bitmapResolution: a.dataFormat === 'svg' ? 1 : (c.res || 1), dataFormat: a.dataFormat, assetId: a.assetId, md5ext: a.md5ext, rotationCenterX: c.rcx, rotationCenterY: c.rcy }; }),
      sounds: t.sounds.map((s, si) => { const a = putAsset(s.dataURL, 'wav'); const live = (project.targets.find(x => x.id === t.id) || { sounds: [] }).sounds[si]; const b = live && live.buffer; return { name: s.name, assetId: a.assetId, dataFormat: a.dataFormat, format: '', rate: b ? b.sampleRate : 22050, sampleCount: b ? b.length : 22050, md5ext: a.md5ext }; }),
      volume: t.volume ?? 100, layerOrder: t.isStage ? 0 : order.indexOf(t) + 1

    else Object.assign(o, { visible: t.visible, x: t.x, y: t.y, size: t.size, direction: t.direction, draggable: !!t.draggable, rotationStyle: t.rotationStyle });

  });

  const used = new Set(); const js = JSON.stringify(targets);
  if (/"opcode":"pen_/.test(js)) used.add('pen'); if (/"opcode":"music_/.test(js)) used.add('music');
  const monitors = d.variables.filter(v => v.monitor).map((v, i) => ({
    id: v.id, mode: v.type === 'list' ? 'list' : 'default', opcode: v.type === 'list' ? 'data_listcontents' : 'data_variable',
    params: v.type === 'list' ? { LIST: v.orig || v.name } : { VARIABLE: v.orig || v.name },
    spriteName: v.owner && v.owner !== stageT.id ? ((d.targets.find(t => t.id === v.owner) || {}).name || null) : null,

  zip.file('project.json', JSON.stringify({ targets, monitors, extensions: [...used], meta: { semver: '3.0.0', vm: '0.2.0', agent: 'BilfenBlock' } }));
  return zip.generateAsync({ type: 'blob', compression: 'DEFLATE' });
}

  return { x: clamp((e.clientX - r.left) / r.width * 480 - 240, -240, 240), y: clamp(180 - (e.clientY - r.top) / r.height * 360, -180, 180) };
}
let drag = null;
window.addEventListener('pointermove', e => {
  const p = stagePos(e); mouse.x = p.x; mouse.y = p.y;
  $('coords').textContent = `x: ${Math.round(p.x)} · y: ${Math.round(p.y)}`;
  if (drag) { drag.moved = true; drag.inst.x = p.x + drag.dx; drag.inst.y = p.y + drag.dy; keepInFence(drag.inst); redraw = true; }
});
cv.addEventListener('pointerdown', e => {
  audio(); const p = stagePos(e); mouse.x = p.x; mouse.y = p.y; mouse.down = true;
  if (document.activeElement && document.activeElement !== document.body && document.activeElement.blur) document.activeElement.blur();
  const px = 240 + p.x, py = 180 - p.y;
  let hit = null; for (let i = drawList.length - 1; i >= 0; i--) if (pointHits(drawList[i], px, py)) { hit = drawList[i]; break; }
  if (hit) {
    const idle = !threads.length;
    startHats('event_whenthisspriteclicked', null, { insts: [hit], restart: true });

});

cv.addEventListener('pointermove', e => { if (drag) return; const p = stagePos(e), px = 240 + p.x, py = 180 - p.y; cv.style.cursor = drawList.some(i => pointHits(i, px, py)) ? 'grab' : ''; });
